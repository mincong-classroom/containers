spring:
  main:
    web-application-type: reactive
  application:
    name: genai-service
  profiles:
    active: production
  config:
    import: optional:classpath:/creds.yaml
  ai:
    chat:
      client:
        enabled: true
    # These apply when using spring-ai-starter-model-azure-openai
    azure:
      openai:
        api-key: ${AZURE_OPENAI_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        chat:
          options:
            temperature: 0.7
            deployment-name: gpt-4o
    # These apply when using spring-ai-starter-model-openai
    openai:
      api-key: ${OPENAI_API_KEY:demo}
      chat:
        options:
            temperature: 0.7
            model: gpt-4o-mini
    vectorstore:
      # The implementation of the vector store:
      # - "simple": in the memory of the service, loaded from vectorstore.json at startup
      # - "qdrant": a Qdrant server, at spring.ai.vectorstore.qdrant.host and port (6334, gRPC),
      #   whose collection vector_store already holds the vets: the service neither creates it
      #   nor loads it
      type: simple
  cloud:
    gateway:
      server:
        webflux:
          filter:
            # The client of Qdrant brings gRPC, with which the gateway creates its filter
            # JsonToGrpc. That filter needs the class io.grpc.netty.NettyChannelBuilder, which the
            # client doesn't have (it has the shaded Netty of gRPC), and the service would fail
            # to start. This service routes no gRPC.
            json-to-grpc:
              enabled: false


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
---
# The Config Server, except in Kubernetes
spring:
  config:
    activate:
      on-profile: "!kubernetes"
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}

---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888

---
# Kubernetes: the configuration comes from a ConfigMap, mounted as a file, as it comes from the
# Config Server elsewhere.
spring:
  config:
    activate:
      on-profile: kubernetes
    import: file:/config/application.yml
  cloud:
    config:
      enabled: false
